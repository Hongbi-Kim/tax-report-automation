  - id: Q-2-01
    topic: "[2차] 샘플컴퍼니2 PDF의 회색 처리·'확인중' 칸 금액 요청"
    scope: 보고서
    status: 답변 있음
    question: >-
      샘플컴퍼니2 2024·2025 세무조정계산서에서 아래 칸이 회색 처리되었거나 숫자 대신 '확인중'으로 되어 있어 금액을 확인할 수 없습니다.
      (1) 2025 표준손익계산서 p52 매출액(1, 빈칸)·상품매출(2)·국내상품매출(3)·매출총손익(66)·판매비와관리비(67, '확인중')·지급수수료(104·105)
      (2) 2024 표준손익계산서 p49 상품매출원가(36)·당기매입원가(38)·매출총손익(66)·판매비와관리비(67)·지급수수료(104·105)
