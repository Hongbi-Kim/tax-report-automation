# 조정료 보수표 (2026-11-21 담당자 회신, Q-002-1 답변 있음)
# 기본보수 = base + (기준금액 - over) × rate
# 기준금액 = max(당기 매출액, 당기 자산총계 × 1/2)  — 요구사항 C24
basis: max(revenue, total_assets/2)
brackets:
  - {from: 0,               to: 100000000,      base: 500000,   over: 0,              rate: 0}
  - {from: 100000000,       to: 500000000,      base: 500000,   over: 100000000,      rate: 0.0014}
  - {from: 500000000,       to: 1000000000,     base: 1060000,  over: 500000000,      rate: 0.0012}
  - {from: 1000000000,      to: 5000000000,     base: 1660000,  over: 1000000000,     rate: 0.0011}
  - {from: 5000000000,      to: 10000000000,    base: 6060000,  over: 5000000000,     rate: 0.0006}
  - {from: 10000000000,     to: 50000000000,    base: 9060000,  over: 10000000000,    rate: 0.0005}
  - {from: 50000000000,     to: 100000000000,   base: 29060000, over: 50000000000,    rate: 0.0003}
  - {from: 100000000000,    to: null,           special: 별도요청}

# 아래는 아직 답을 받지 못함 (Q-002-2) → 청구서에 «확인 필요»
credit_surcharge_rate: null   # 공제·감면액 가산 비율 (요구사항 C25)
vat: null                     # 부가세 별도/포함
rounding: floor_won           # 가정 A-011: 원 미만 절사
# 관리자 설정 (요구사항 C29: 전 고객 동일)
cms_withdrawal_date: null
feedback_due_date: null
